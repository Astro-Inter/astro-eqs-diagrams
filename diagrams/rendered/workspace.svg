#292234" font-size="13" textLength="134.393">com a sessão Firebase</text><rect x="400.97" y="783.18" width="286.659" height="52.703" fill="#F5F0FC" style="stroke:#7952A5;stroke-width:0.5;" rx="6" ry="6"/><text x="410.97" y="806.675" fill="#292234" font-size="13" textLength="266.659">Solicitar compensação da identidade Firebase</text><text x="410.97" y="823.026" fill="#292234" font-size="13" textLength="244.239">e exibir erro para correção / nova tentativa</text><polygon points="371.392,987.289,383.392,999.289,371.392,1011.289,359.392,999.289,371.392,987.289" fill="#E9DCF8" style="stroke:#7952A5;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="717.628" y="605.125" width="220.878" height="52.703" fill="#F5F0FC" style="stroke:#7952A5;stroke-width:0.5;" rx="6" ry="6"/><text x="727.628" y="628.62" fill="#292234" font-size="13" textLength="192.931">Exibir erros de cadastro / planilha</text><text x="727.628" y="644.972" fill="#292234" font-size="13" textLength="200.878">sem criar identidade ou workspace</text><polygon points="599.73,1017.289,611.73,1029.289,599.73,1041.289,587.73,1029.289,599.73,1017.289" fill="#E9DCF8" style="stroke:#7952A5;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="968.506" y="369.367" width="229.504" height="36.352" fill="#F5F0FC" style="stroke:#7952A5;stroke-width:0.5;" rx="6" ry="6"/><text x="978.506" y="392.862" fill="#292234" font-size="13" textLength="209.504">Exibir erro e permitir corrigir a chave</text><polygon points="841.494,1047.289,853.494,1059.289,841.494,1071.289,829.494,1059.289,841.494,1047.289" fill="#E9DCF8" style="stroke:#7952A5;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="841.494" cy="1102.289" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="841.494" cy="1102.289" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="841.494" y1="73.609" x2="841.494" y2="93.609" style="stroke:#645679;stroke-width:1;"/><p