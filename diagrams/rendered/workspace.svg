nejoin:miter;stroke-miterlimit:10;"/><text x="770.308" y="352.687" fill="#292234" font-size="13" textLength="142.372">Chave aceita pelo fluxo?</text><text x="738.091" y="344.511" fill="#000" font-size="13" textLength="20.217">sim</text><text x="924.68" y="344.511" fill="#000" font-size="13" textLength="21.69">não</text><rect x="453.887" y="369.367" width="291.686" height="52.703" fill="#F5F0FC" style="stroke:#7952A5;stroke-width:0.5;" rx="6" ry="6"/><text x="463.887" y="392.862" fill="#292234" font-size="13" textLength="271.686">Preencher empresa, CNPJ, conta responsável,</text><text x="463.887" y="409.214" fill="#292234" font-size="13" textLength="156.102">endereços e planilha inicial</text><rect x="493.283" y="442.07" width="212.893" height="52.703" fill="#F5F0FC" style="stroke:#7952A5;stroke-width:0.5;" rx="6" ry="6"/><text x="503.283" y="465.565" fill="#292234" font-size="13" textLength="192.893">Enviar POST /register-workspace</text><text x="503.283" y="481.917" fill="#292234" font-size="13" textLength="187.897">com dados e planilha XLS/XLSX</text><rect x="461.469" y="514.773" width="276.521" height="36.352" fill="#F5F0FC" style="stroke:#7952A5;stroke-width:0.5;" rx="6" ry="6"/><text x="471.469" y="538.269" fill="#292234" font-size="13" textLength="256.521">API valida conflitos, linhas, gestor e vínculos</text><polygon points="555.287,571.125,644.173,571.125,656.173,583.125,644.173,595.125,555.287,595.125,543.287,583.125,555.287,571.125" fill="#E9DCF8" style="stroke:#7952A5;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="555.287" y="588.444" fill="#292234" font-size="13" textLength="88.886">Dados válidos?</text><text x="523.069" y="580.269" fill="#000" font-size="13" textLength="20.217">sim</text><text x="656.173" y="580.269" fill="#000" font-size="13" textLength="21.69">não</text><rect x="242.519" y="605.125" width="257.745" height="36.352" fill="#F5F0FC" style="stroke:#7952A5;stroke-width:0.5;" rx="6" ry="6"/><text x="252.519" y="628.6